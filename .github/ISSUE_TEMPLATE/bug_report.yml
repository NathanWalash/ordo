name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Unclutter
        2. ...
  - type: input
    id: version
    attributes:
      label: Ordo version
      placeholder: 0.1.0
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please don't paste email addresses, message content or passwords.
