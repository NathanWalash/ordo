name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Integration tests (GreenMail IMAP, Radicale CalDAV)
        run: |
          pnpm imap:start
          pnpm caldav:start
          node scripts/wait-for-port.mjs 3143
          node scripts/wait-for-port.mjs 5232
          pnpm test:integration
        env:
          IMAP_TEST_PORT: '3143'
          CALDAV_TEST_PORT: '5232'

  e2e:
    name: Build and end-to-end (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: End-to-end tests (Linux, virtual display, with a local IMAP server)
        if: runner.os == 'Linux'
        run: |
          pnpm imap:start
          node scripts/wait-for-port.mjs 3143
          xvfb-run -a pnpm test:e2e
        env:
          IMAP_TEST_PORT: '3143'
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
