packages:
  - apps/*
  - packages/*
nodeLinker: hoisted
# Electron downloads its binary lazily on first run, so no install scripts are needed.
allowBuilds:
  electron: false
  electron-winstaller: false
# tldts 7.4.19 would otherwise pull a days-old tldts-core; keep them in step.
overrides:
  tldts-core: 7.4.19
