name: Release

# Push a tag like v0.1.0 to build installers for every platform and attach
# them to a draft GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match app version v$version"; exit 1; }
      - run: pnpm --filter @ordo/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
