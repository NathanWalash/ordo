name: Release

# Builds the installers for a version and attaches them to a draft GitHub Release whose notes are
# that version's CHANGELOG.md section. `pnpm release <version>` pushes the tag that starts it (see
# docs/updates.md); to rebuild an existing tag, run it from the Actions tab. Check the draft, then
# publish it: installed copies of Ordo only see published releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      matrix:
        # macos-latest builds both the arm64 and x64 DMGs (electron-builder.yml).
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches app version
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          version=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$version" = "$TAG" ] || { echo "::error::Tag $TAG does not match app version v$version"; exit 1; }
      # Build only; the release job below is the one allowed to write to the repository.
      - run: pnpm package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/latest*.yml

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A re-run replaces the files on its own draft, but never touches a published release.
            [ "$draft" = "true" ] || { echo "::error::$TAG is already published; not changing it."; exit 1; }
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "Ordo ${TAG#v}" --notes-file release-notes.md
          fi
